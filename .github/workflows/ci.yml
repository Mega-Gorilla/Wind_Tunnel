name: Repository and simulation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: software/control/requirements*.txt
      - name: Audit tracked files and hardware dependencies
        run: python tools/repository/audit.py --staged --public
      - name: Test repository safeguards
        run: python -m unittest discover -s tools/repository/tests -v
      - name: Install simulation test dependencies
        working-directory: software/control
        run: python -m pip install -r requirements-dev.txt
      - name: Test software without connected hardware
        working-directory: software/control
        run: python -m pytest -q tests
